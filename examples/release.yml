# A complete release workflow for an extension based on duckdb/extension-template.
# Pushing a tag builds the default platforms, signs the binaries, tests the ones it can and publishes them to your repository.
name: Release extension

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: my_ext

  # Has the signing key, and never runs your extension's code. Environment secrets with required reviewers keep the key away
  # from everything else in the repository.
  sign:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release-signing
    outputs:
      bundle-digest: ${{ steps.sign.outputs.bundle-digest }}
    steps:
      # Replace <commit-sha> with the commit of a release: this step handles your signing key.
      - id: sign
        uses: tobilg/duckdb-extension-self-hosting@<commit-sha> # v1.0.0
        with:
          mode: sign
          extension-name: my_ext
          signing-key: ${{ secrets.EXTENSION_SIGNING_KEY }}
          # Listed in the key file, so that clients can pin it too. See "Rotating keys" in the README.
          additional-public-keys: ${{ vars.EXTENSION_RESERVE_PUBLIC_KEY }}

  # Runs your extension's code, so it has no secrets at all. A runner can only test its own platform, so these cover Linux
  # on x86 and Arm, and macOS on Apple Silicon. For Intel Macs, add macos-26-intel here and opt_in_archs: osx_amd64 to the
  # build job.
  verify:
    needs: sign
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions: {}
    steps:
      - uses: tobilg/duckdb-extension-self-hosting@<commit-sha> # v1.0.0
        with:
          mode: verify

  # Has the storage credentials, and only runs after every verify job has passed.
  publish:
    needs: [sign, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release-storage
    # Releases go out one at a time: uploads of two runs could otherwise mix on the latest paths.
    concurrency:
      group: publish-my_ext
      cancel-in-progress: false
    steps:
      - uses: tobilg/duckdb-extension-self-hosting@<commit-sha> # v1.0.0
        with:
          mode: publish
          bundle-digest: ${{ needs.sign.outputs.bundle-digest }}
          s3-endpoint: ${{ secrets.S3_ENDPOINT }}
          s3-bucket: my-extensions
          s3-access-key-id: ${{ secrets.S3_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          repository-url: https://extensions.example.com
