name: DuckDB Extension Publisher
description: Sign DuckDB extensions with your own key and publish them to a custom extension repository on S3-compatible storage.
author: tobilg
branding:
  icon: package
  color: yellow

inputs:
  extension-name:
    description: Extension to publish. Selects the build artifacts, and skips any other extension found in them.
    required: false
  artifact-pattern:
    description: Glob for the workflow artifacts to download. Defaults to <extension-name>-*-extension-*.
    required: false
  path:
    description: Directory that already holds the binaries. When set, no artifacts are downloaded.
    required: false
  signing-key:
    description: RSA-2048 private key in PEM format. Pass it from a secret.
    required: true
  additional-public-keys:
    description: Further public keys to list in the key file, such as a reserve key for rotation. One or more PEM blocks.
    required: false
  mode:
    description: "'publish' signs and uploads. 'sign-only' stops after signing and leaves a repository tree in signed-dir."
    required: false
    default: publish
  exclude-platforms:
    description: Comma or space separated platforms to skip, such as wasm_mvp.
    required: false
  duckdb-version:
    description: DuckDB version directory, or a comma separated list. Only required for C_STRUCT builds. Other builds take it from their footer.
    required: false
  extension-version:
    description: Version used in the versioned path. Defaults to the version in the footer.
    required: false
  s3-bucket:
    description: Bucket to publish to. Required in publish mode.
    required: false
  s3-prefix:
    description: Key prefix inside the bucket.
    required: false
  s3-endpoint:
    description: S3 API endpoint, such as https://<account_id>.r2.cloudflarestorage.com. Leave empty for AWS.
    required: false
  s3-region:
    description: Bucket region. Falls back to AWS_REGION, and to auto on R2.
    required: false
  s3-provider:
    description: rclone S3 provider. Detected from the endpoint when empty.
    required: false
  s3-access-key-id:
    description: Access key. Falls back to AWS_ACCESS_KEY_ID, so role assumption through OIDC works.
    required: false
  s3-secret-access-key:
    description: Secret key. Falls back to AWS_SECRET_ACCESS_KEY.
    required: false
  s3-session-token:
    description: Session token. Falls back to AWS_SESSION_TOKEN.
    required: false
  upload-latest:
    description: Upload to <duckdb_version>/<platform>/, which INSTALL reads by default.
    required: false
    default: 'true'
  upload-versioned:
    description: Upload to <name>/<extension_version>/<duckdb_version>/<platform>/, which INSTALL ... VERSION reads.
    required: false
    default: 'true'
  overwrite-versioned:
    description: Allow replacing a versioned object with different bytes. By default that fails the run.
    required: false
    default: 'false'
  publish-key-file:
    description: Publish .well-known/duckdb-extension-repo.json.
    required: false
    default: 'true'
  smoke-test:
    description: After uploading, install and load the extension with the matching DuckDB CLI on this runner.
    required: false
    default: 'true'
  repository-url:
    description: Public prefix clients use, such as https://extensions.example.com. Without it, the smoke test and summary use s3://<bucket>/<prefix>.
    required: false
  smoke-test-setup-sql:
    description: SQL to run in the smoke test before the repository is created, such as a custom CA file.
    required: false

outputs:
  fingerprint:
    description: SHA-256 fingerprint of the signing key, in the format DuckDB reports it.
    value: ${{ steps.setup.outputs.fingerprint }}
  signed-dir:
    description: Directory with the signed files, laid out like the repository.
    value: ${{ steps.sign.outputs.signed-dir }}
  files:
    description: JSON array with platform, versions, ABI, object path and SHA-256 of each file.
    value: ${{ steps.summary.outputs.files }}
  repository-url:
    description: Prefix clients use for CREATE EXTENSION REPOSITORY. Empty in sign-only mode.
    value: ${{ steps.summary.outputs.repository-url }}

runs:
  using: composite
  steps:
    - name: Check inputs and load the signing key
      id: setup
      shell: bash
      env:
        INPUT_SIGNING_KEY: ${{ inputs.signing-key }}
        INPUT_ADDITIONAL_PUBLIC_KEYS: ${{ inputs.additional-public-keys }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_EXTENSION_NAME: ${{ inputs.extension-name }}
        INPUT_ARTIFACT_PATTERN: ${{ inputs.artifact-pattern }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_S3_BUCKET: ${{ inputs.s3-bucket }}
        INPUT_S3_ENDPOINT: ${{ inputs.s3-endpoint }}
        INPUT_UPLOAD_LATEST: ${{ inputs.upload-latest }}
        INPUT_UPLOAD_VERSIONED: ${{ inputs.upload-versioned }}
        INPUT_OVERWRITE_VERSIONED: ${{ inputs.overwrite-versioned }}
        INPUT_PUBLISH_KEY_FILE: ${{ inputs.publish-key-file }}
        INPUT_SMOKE_TEST: ${{ inputs.smoke-test }}
      run: bash "$GITHUB_ACTION_PATH/scripts/setup-key.sh"

    - name: Download build artifacts
      if: inputs.path == ''
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: ${{ inputs.artifact-pattern != '' && inputs.artifact-pattern || format('{0}-*-extension-*', inputs.extension-name) }}
        path: ${{ steps.setup.outputs.work-dir }}/artifacts
        merge-multiple: false

    - name: Sign extensions
      id: sign
      shell: bash
      env:
        WORK_DIR: ${{ steps.setup.outputs.work-dir }}
        SOURCE_DIR: ${{ inputs.path != '' && inputs.path || format('{0}/artifacts', steps.setup.outputs.work-dir) }}
        INPUT_EXTENSION_NAME: ${{ inputs.extension-name }}
        INPUT_EXCLUDE_PLATFORMS: ${{ inputs.exclude-platforms }}
        INPUT_DUCKDB_VERSION: ${{ inputs.duckdb-version }}
        INPUT_EXTENSION_VERSION: ${{ inputs.extension-version }}
        INPUT_UPLOAD_LATEST: ${{ inputs.upload-latest }}
        INPUT_UPLOAD_VERSIONED: ${{ inputs.upload-versioned }}
        INPUT_PUBLISH_KEY_FILE: ${{ inputs.publish-key-file }}
      run: bash "$GITHUB_ACTION_PATH/scripts/sign.sh"

    - name: Install rclone
      if: inputs.mode != 'sign-only'
      shell: bash
      env:
        WORK_DIR: ${{ steps.setup.outputs.work-dir }}
      run: bash "$GITHUB_ACTION_PATH/scripts/install-rclone.sh"

    - name: Upload to the repository
      if: inputs.mode != 'sign-only'
      shell: bash
      env:
        WORK_DIR: ${{ steps.setup.outputs.work-dir }}
        INPUT_S3_BUCKET: ${{ inputs.s3-bucket }}
        INPUT_S3_PREFIX: ${{ inputs.s3-prefix }}
        INPUT_S3_ENDPOINT: ${{ inputs.s3-endpoint }}
        INPUT_S3_REGION: ${{ inputs.s3-region }}
        INPUT_S3_PROVIDER: ${{ inputs.s3-provider }}
        INPUT_S3_ACCESS_KEY_ID: ${{ inputs.s3-access-key-id }}
        INPUT_S3_SECRET_ACCESS_KEY: ${{ inputs.s3-secret-access-key }}
        INPUT_S3_SESSION_TOKEN: ${{ inputs.s3-session-token }}
        INPUT_OVERWRITE_VERSIONED: ${{ inputs.overwrite-versioned }}
      run: bash "$GITHUB_ACTION_PATH/scripts/upload.sh"

    - name: Smoke test
      if: inputs.mode != 'sign-only' && inputs.smoke-test == 'true'
      shell: bash
      env:
        WORK_DIR: ${{ steps.setup.outputs.work-dir }}
        INPUT_S3_BUCKET: ${{ inputs.s3-bucket }}
        INPUT_S3_PREFIX: ${{ inputs.s3-prefix }}
        INPUT_S3_ENDPOINT: ${{ inputs.s3-endpoint }}
        INPUT_S3_REGION: ${{ inputs.s3-region }}
        INPUT_S3_ACCESS_KEY_ID: ${{ inputs.s3-access-key-id }}
        INPUT_S3_SECRET_ACCESS_KEY: ${{ inputs.s3-secret-access-key }}
        INPUT_S3_SESSION_TOKEN: ${{ inputs.s3-session-token }}
        INPUT_REPOSITORY_URL: ${{ inputs.repository-url }}
        INPUT_SMOKE_TEST_SETUP_SQL: ${{ inputs.smoke-test-setup-sql }}
      run: bash "$GITHUB_ACTION_PATH/scripts/smoke-test.sh"

    - name: Write the summary
      id: summary
      shell: bash
      env:
        WORK_DIR: ${{ steps.setup.outputs.work-dir }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_S3_BUCKET: ${{ inputs.s3-bucket }}
        INPUT_S3_PREFIX: ${{ inputs.s3-prefix }}
        INPUT_REPOSITORY_URL: ${{ inputs.repository-url }}
      run: bash "$GITHUB_ACTION_PATH/scripts/summary.sh"

    - name: Remove the signing key
      if: always()
      shell: bash
      env:
        WORK_DIR: ${{ steps.setup.outputs.work-dir }}
      run: bash "$GITHUB_ACTION_PATH/scripts/cleanup.sh"
